<g data-model="Claude Opus 5.5" data-headline="90.0"><title>Claude Opus 5.5: headline 90.00</title><circle cx="565.1" cy="252.0" r="4.5" fill="#f9fafd" stroke="#9a9fa7" stroke-width="1.5" /><text class="cap halo" x="574.1" y="256.0" text-anchor="start" style="fill:#9a9fa7">Claude Opus 5.5*</text></g>
<g data-model="Mistral OCR" data-headline="89.88"><title>Mistral OCR: headline 89.88</title><circle cx="228.4" cy="253.9" r="5" fill="#3a3d44" /><text class="nm halo" x="237.4" y="257.9" text-anchor="start">Mistral OCR</text></g>
<g data-model="Claude Sonnet 5.5" data-headline="88.89"><title>Claude Sonnet 5.5: headline 88.89</title><circle cx="483.1" cy="269.8" r="4.5" fill="#f9fafd" stroke="#9a9fa7" stroke-width="1.5" /><text class="cap halo" x="492.1" y="273.8" text-anchor="start" style="fill:#9a9fa7">Claude Sonnet 5.5*</text></g>
