<text class="num" x="56" y="176.0" text-anchor="end">95</text>
<line x1="64" x2="610" y1="92.0" y2="92.0" stroke="#e9ebf0" />
<text class="num" x="56" y="96.0" text-anchor="end">100</text>
<line x1="64.0" x2="64.0" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="64.0" y="430" text-anchor="middle">1</text>
<line x1="146.2" x2="146.2" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="146.2" y="430" text-anchor="middle">2</text>
<line x1="254.8" x2="254.8" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="254.8" y="430" text-anchor="middle">5</text>
<line x1="337.0" x2="337.0" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="337.0" y="430" text-anchor="middle">10</text>
<line x1="419.2" x2="419.2" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="419.2" y="430" text-anchor="middle">20</text>
<line x1="527.8" x2="527.8" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="527.8" y="430" text-anchor="middle">50</text>
<line x1="610.0" x2="610.0" y1="92" y2="412" stroke="#e9ebf0" />
<text class="num" x="610.0" y="430" text-anchor="middle">100</text>
<text class="cap" x="337" y="452" text-anchor="middle">dollars per 1,000 pages, log scale</text>
<text class="cap" transform="translate(20 252) rotate(-90)" text-anchor="middle">headline</text>
<polyline points="194.3,193.1 302.9,193.1 302.9,177.0 527.5,177.0 527.5,156.2 610.0,156.2" fill="none" stroke="#595e66" stroke-width="1.5" stroke-dasharray="4 3" />
<g data-model="Gemini 4 Argon" data-headline="95.99"><title>Gemini 4 Argon: headline 95.99</title><circle cx="527.5" cy="156.2" r="5" fill="#3a3d44" /><text class="nm halo" x="518.5" y="160.2" text-anchor="end">Gemini 4 Argon</text></g>
<g data-model="Gemini 4 Carbon" data-headline="95.67"><title>Gemini 4 Carbon: headline 95.67</title><circle cx="546.9" cy="161.3" r="5" fill="#3a3d44" /><text class="nm halo" x="555.9" y="177.3" text-anchor="start">Gemini 4 Carbon</text></g>
