<g data-model="Extend" data-headline="83.44"><title>Extend: headline 83.44</title><circle cx="481.2" cy="357.0" r="5" fill="#3a3d44" /><text class="nm halo" x="490.2" y="361.0" text-anchor="start">Extend</text></g>
<g data-model="Azure" data-headline="83.44"><title>Azure: headline 83.44</title><circle cx="254.8" cy="357.0" r="5" fill="#3a3d44" /><text class="nm halo" x="263.8" y="361.0" text-anchor="start">Azure</text></g>
<text class="cap" x="24" y="486">* Used in creating and verifying at least some tests.</text>
