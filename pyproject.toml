[project]
name = "omni-parse-bench"
version = "0.1.0"
description = "A document-parsing benchmark: yes/no tests on single pages, graded against a provider's outputs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
dependencies = [
    "beautifulsoup4>=4.12",  # table structure
    "fuzzysearch>=0.7",      # positional near-matches for order tests
    "mini-racer>=0.12",      # an embedded V8 that runs KaTeX, which equations are compared by
    "pylatexenc>=2.10",      # LaTeX spans -> text in the fold
    "rapidfuzz>=3.0",        # fuzzy containment for text and table cells
]

[project.optional-dependencies]
# Producing predictions: the provider adapters. Scoring reads JSON off a disk and needs none of it.
harness = [
    "httpx>=0.27",
    "markdown-it-py>=3.0",   # a vendor's markdown -> HTML, one converter for every provider
    "openai>=1.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "rich>=13.0",
]
# Running the published benchmark end to end: fetch the dataset and read its manifest.
benchmark = [
    "omni-parse-bench[harness]",
    "huggingface_hub>=0.23",
    "pyarrow>=15.0.0",
]
dev = [
    "omni-parse-bench[benchmark]",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
# `opb` is the one to type; the long name stays so the package and its command match.
opb = "omni_parse_bench.cli:main"
omni-parse-bench = "omni_parse_bench.cli:main"

[project.urls]
Homepage = "https://github.com/datalab-to/omni_parse_bench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_parse_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E701", "E731"]   # one-line `if x: return y`, and small named lambdas, are the house style
